<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>User Authentication</title>
    <style>
        :root { font-family: Arial, sans-serif; color: #1f2937; background: #f3f4f6; }
        body { margin: 0; min-height: 100vh; display: grid; place-items: center; }
        .card { width: min(420px, calc(100% - 32px)); padding: 32px; background: white; border-radius: 12px; box-shadow: 0 8px 30px #00000018; }
        h1 { margin-top: 0; text-align: center; }
        .tabs { display: flex; margin-bottom: 24px; border-bottom: 1px solid #d1d5db; }
        .tabs button { flex: 1; border: 0; padding: 12px; background: none; cursor: pointer; font-size: 1rem; }
        .tabs button.active { color: #2563eb; border-bottom: 2px solid #2563eb; font-weight: bold; }
        label { display: block; margin: 14px 0 6px; font-weight: bold; }
        input { box-sizing: border-box; width: 100%; padding: 11px; border: 1px solid #9ca3af; border-radius: 6px; font-size: 1rem; }
        .submit { width: 100%; margin-top: 22px; padding: 12px; border: 0; border-radius: 6px; color: white; background: #2563eb; cursor: pointer; font-size: 1rem; }
        .submit:disabled { background: #93c5fd; cursor: wait; }
        .message { min-height: 24px; margin-top: 18px; text-align: center; }
        .error { color: #b91c1c; }
        .success { color: #15803d; }
        .hidden { display: none; }
    </style>
</head>
<body>
    <main class="card">
        <h1>Inventory Management</h1>
        <div class="tabs">
            <button id="loginTab" class="active" type="button">Login</button>
            <button id="registerTab" type="button">Register</button>
        </div>

        <form id="loginForm">
            <label for="loginIdentifier">Username or email</label>
            <input id="loginIdentifier" name="usernameOrEmail" required autocomplete="username" />
            <label for="loginPassword">Password</label>
            <input id="loginPassword" name="password" type="password" required autocomplete="current-password" />
            <button class="submit" type="submit">Login</button>
        </form>

        <form id="registerForm" class="hidden">
            <label for="registerUsername">Username</label>
            <input id="registerUsername" name="username" minlength="3" maxlength="50" required autocomplete="username" />
            <label for="registerEmail">Email</label>
            <input id="registerEmail" name="email" type="email" maxlength="256" required autocomplete="email" />
            <label for="registerPassword">Password</label>
            <input id="registerPassword" name="password" type="password" minlength="8" required autocomplete="new-password" />
            <button class="submit" type="submit">Create account</button>
        </form>

        <p id="message" class="message" role="status"></p>
    </main>

    <script>
        const loginTab = document.getElementById('loginTab');
        const registerTab = document.getElementById('registerTab');
        const loginForm = document.getElementById('loginForm');
        const registerForm = document.getElementById('registerForm');
        const message = document.getElementById('message');

        function selectForm(form) {
            const loginSelected = form === loginForm;
            loginForm.classList.toggle('hidden', !loginSelected);
            registerForm.classList.toggle('hidden', loginSelected);
            loginTab.classList.toggle('active', loginSelected);
            registerTab.classList.toggle('active', !loginSelected);
            message.textContent = '';
            message.className = 'message';
        }

        function showMessage(text, isError) {
            message.textContent = text;
            message.className = `message ${isError ? 'error' : 'success'}`;
        }

        async function sendAuthenticationRequest(url, payload, button) {
            button.disabled = true;
            showMessage('Please wait...', false);
            try {
                const response = await fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                const result = await response.json();
                if (!response.ok) {
                    const validationMessage = result.errors
                        ? Object.values(result.errors).flat().join(' ')
                        : result.message || 'The request could not be completed.';
                    throw new Error(validationMessage);
                }
                localStorage.setItem('authToken', result.token);
                showMessage('Authentication successful.', false);
            } catch (error) {
                showMessage(error.message, true);
            } finally {
                button.disabled = false;
            }
        }

        loginTab.addEventListener('click', () => selectForm(loginForm));
        registerTab.addEventListener('click', () => selectForm(registerForm));

        loginForm.addEventListener('submit', event => {
            event.preventDefault();
            const form = new FormData(loginForm);
            sendAuthenticationRequest('/api/auth/login', {
                usernameOrEmail: form.get('usernameOrEmail'),
                password: form.get('password')
            }, event.submitter);
        });

        registerForm.addEventListener('submit', event => {
            event.preventDefault();
            const form = new FormData(registerForm);
            sendAuthenticationRequest('/api/auth/register', {
                username: form.get('username'),
                email: form.get('email'),
                password: form.get('password')
            }, event.submitter);
        });
    </script>
</body>
</html>
